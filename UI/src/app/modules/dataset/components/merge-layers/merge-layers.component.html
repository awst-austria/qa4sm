<div *ngIf="available$ | async" class="merge-layers mt-3 mb-3">

  <div class="flex align-items-center gap-2">
    <!-- the checkbox both reveals the layer list and switches merging on;
         switching it off drops the ticks and hands the variable dropdown back.
         The help icon stays outside the label, so clicking it never toggles. -->
    <p-checkbox [binary]="true"
                inputId="merge_enabled_{{ configModel.datasetModel.selectedVersion?.id }}"
                [ngModel]="configModel.mergeEnabled$ | async"
                (ngModelChange)="setEnabled($event)">
    </p-checkbox>
    <label for="merge_enabled_{{ configModel.datasetModel.selectedVersion?.id }}"
           class="cursor-pointer">
      <b>Merge layers</b>
    </label>
    <span class="pi pi-question-circle help-field"
          pTooltip="Combine several depth layers of this dataset into a single series.
                    Each layer is weighted by its thickness, by default, so a thicker
                    layer counts proportionally more. A timestamp is kept only where
                    every selected layer has data. While this is on, the variable
                    above is set by the layers you tick."
          tooltipPosition="bottom">
    </span>
    <!-- column heading for the percentages below. ml-auto pushes it to the
         right edge, and sharing .layer-weight keeps it on the same 3rem
         right-aligned column the values use. Only shown while there are
         weights to head, which is the same condition that renders them. -->
    <span *ngIf="(configModel.mergeEnabled$ | async) && isMerging()"
          class="layer-weight layer-weight-header ml-auto">
      Weight
    </span>
  </div>

  <div class="merge-body"
       [class.expanded]="configModel.mergeEnabled$ | async"
       id="merge_body_{{ configModel.datasetModel.selectedVersion?.id }}">
    <div class="merge-body-inner">
      <!-- the gap under the title lives in here rather than on the title row,
           so it folds away with the rest of the panel -->
      <div class="pt-2">

        <div *ngFor="let layer of selectableLayers$ | async"
             class="flex align-items-center gap-2 py-1">
          <p-checkbox [binary]="true"
                      [inputId]="'merge_' + layer.id"
                      [ngModel]="isSelected(layer)"
                      (ngModelChange)="toggle(layer)">
          </p-checkbox>
          <label [for]="'merge_' + layer.id" class="cursor-pointer flex-grow-1">
            {{ layer.short_name }}
            <span class="text-muted ml-2">{{ layerLabel(layer) }}</span>
          </label>
          <span class="layer-weight">{{ layerWeight(layer) }}</span>
        </div>

        <!-- one box, two states: the merge summary once two layers are ticked,
             and the warning in its place while fewer are. role="status" reads
             the warning out as it appears without moving focus. -->
        <div *ngIf="configModel.mergeEnabled$ | async"
             class="merge-summary mt-2 p-2"
             [class.merge-warning]="isIncomplete()"
             role="status">

          <div *ngIf="isIncomplete(); else summary" class="flex align-items-center gap-2">
            <span class="pi pi-exclamation-triangle" aria-hidden="true"></span>
            <span>At least two layers required when layer merging</span>
          </div>

          <ng-template #summary>
            <div class="flex align-items-center gap-2">
              <span class="pi pi-arrows-v"></span>
              <span>Merged depth: <b>{{ mergedRangeLabel$ | async }}</b></span>
            </div>

            <div *ngIf="hasGap()" class="merge-gap-note mt-1">
              <span class="pi pi-info-circle mr-1"></span>
              These layers are not adjacent. The result is the thickness-weighted mean of
              exactly the layers you picked; the skipped depths contribute nothing.
            </div>

            <div class="flex align-items-center gap-2 mt-2">
              <p-checkbox [binary]="true"
                          inputId="merge_weighted_{{ configModel.datasetModel.selectedVersion?.id }}"
                          [ngModel]="configModel.mergeWeighted$ | async"
                          (ngModelChange)="setWeighted($event)">
              </p-checkbox>
              <label for="merge_weighted_{{ configModel.datasetModel.selectedVersion?.id }}"
                     class="cursor-pointer">
                Weight each layer by its thickness
              </label>
              <span class="pi pi-question-circle help-field"
                    pTooltip="On, a 30 cm layer counts three times as much as a 10 cm one.
                              Off, every selected layer counts equally regardless of how much
                              soil it represents."
                    tooltipPosition="bottom">
              </span>
            </div>

            <div class="merge-output-note mt-2">

            </div>
          </ng-template>
        </div>

      </div>
    </div>
  </div>

</div>
